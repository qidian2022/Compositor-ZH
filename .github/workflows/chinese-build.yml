name: Chinese build
on:
  push:
    branches: [main, zh-Hans]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Chinese resources
        run: python3 localization/generate.py --check
      - name: Crop regression checks
        run: python3 localization/test_crop.py
      - name: AI denoise regression checks
        run: python3 localization/test_ai_denoise.py
      - name: AI subject and background regression checks
        run: python3 localization/test_subject_extraction.py
      - name: Build from source resources
        run: python3 localization/build.py
      - name: Verify bundle and signature
        run: |
          test -s 'build/Compositor 中文版.app/Contents/Resources/ChineseLocalization.json'
          test -s 'build/Compositor 中文版.app/Contents/Resources/CameraRawTables.bin'
          test -s 'build/Compositor 中文版.app/Contents/Resources/FFDNetColor.mlmodel'
          test -s 'build/Compositor 中文版.app/Contents/Resources/LICENSE-FFDNet.txt'
          codesign --verify --deep --strict 'build/Compositor 中文版.app'
